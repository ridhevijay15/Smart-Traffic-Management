<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VegamTraffic | Register</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand auth-brand" href="/login"><span class="brand-mark">V</span>
            <span>Vegam<span class="brand-light">Traffic</span><small>TRAFFIC MANAGEMENT</small></span>
        </a>
        <p class="eyebrow">ACCOUNT SETUP</p>
        <h1>{{REGISTER_TITLE}}</h1>
        <p class="subtitle">{{REGISTER_HELP}}</p>
        {{NOTICE}}
        <form method="post" action="/register">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8" required>
            {{ACCOUNT_FIELDS}}
            <button class="button button-primary" type="submit">Create account</button>
        </form>
        <p class="auth-link">Already registered? <a href="/login">Login</a></p>
    </main>
</body>
</html>
