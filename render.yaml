services:
  - type: web
    name: vegam-traffic
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VEGAM_DB_URL
        value: "jdbc:h2:mem:vegam_traffic;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
      - key: VEGAM_DB_USER
        value: sa
