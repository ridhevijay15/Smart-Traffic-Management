services:
  - type: web
    name: vegam-traffic
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VEGAM_DB_URL
        sync: false
      - key: VEGAM_DB_USER
        sync: false
      - key: VEGAM_DB_PASSWORD
        sync: false
